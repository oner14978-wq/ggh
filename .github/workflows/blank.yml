name: Windows Remoto no GitHub (Tailscale + RDP)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Tipo de runner"
        type: choice
        default: windows-11-2022
        options:
          - windows-11-2022
          - windows-2022
          - windows-2022
      minutos:
        description: "Minutos ligado (máx. 340)"
        type: string
        default: "300"
      nome_pc:
        description: "Nome na rede Tailscale"
        type: string
        default: pc-github

permissions:
  contents: read

jobs:
  pc:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    steps:
      - name: Validar entradas
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if (-not $env:TS_KEY -or -not $env:TS_KEY.StartsWith('tskey-')) {
            Write-Error 'Secret TAILSCALE_AUTH_KEY ausente ou inválido (deve começar com tskey-).'
            exit 1
          }
          $m = 0
          if (-not [int]::TryParse('${{ inputs.minutos }}', [ref]$m) -or $m -lt 1 -or $m -gt 340) {
            Write-Error 'minutos deve ser entre 1 e 340.'
            exit 1
          }

      - name: Criar usuário Rafael e habilitar RDP
        shell: pwsh
        run: |
          $senha = 'Gamer2026Abc'
          "RDP_PASS=$senha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $sec = ConvertTo-SecureString $senha -AsPlainText -Force
          if (Get-LocalUser -Name 'Rafael' -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name 'Rafael' -Password $sec
          } else {
            New-LocalUser -Name 'Rafael' -Password $sec -FullName 'Rafael' -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group 'Administrators' -Member 'Rafael' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'Rafael' -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

      - name: Instalar Tailscale e conectar
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo "::add-mask::$env:TS_KEY"
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
          Write-Host "Arquitetura: $arch"
          $msi = Join-Path $env:TEMP 'tailscale.msi'
          Invoke-WebRequest -UseBasicParsing -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-$arch.msi" -OutFile $msi
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"

          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path $ts)) { Write-Error 'Tailscale não foi instalado.'; exit 1 }

          Set-Service -Name Tailscale -StartupType Automatic
          Start-Service -Name Tailscale -ErrorAction SilentlyContinue
          (Get-Service Tailscale).WaitForStatus('Running', '00:00:30')
          Start-Sleep -Seconds 10

          $ok = $false
          for ($i = 1; $i -le 5 -and -not $ok; $i++) {
            Write-Host "Tentativa $i"
            & $ts up --auth-key="$env:TS_KEY" --hostname='${{ inputs.nome_pc }}' --accept-routes --unattended --reset --timeout=60s 2>&1 | Write-Host
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 10 }
          }
          & $ts status 2>&1 | Write-Host
          if (-not $ok) { Write-Error 'tailscale up falhou (veja o log acima).'; exit 1 }

      - name: IP
        shell: pwsh
        run: |
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $ip = $null
          for ($i = 1; $i -le 10 -and -not $ip; $i++) {
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { Write-Error 'Não foi possível obter o IP do Tailscale.'; exit 1 }
          Write-Host "IP do Tailscale: $ip"
          "TS_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Mostrar acesso
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "Conta do Windows: Rafael"
          Write-Host "Senha: $env:RDP_PASS"
          Write-Host "Codigo de acesso (IP Tailscale): $env:TS_IP"
          Write-Host "=========================================="
          Write-Host "::notice title=Acesso ao PC::Conta: Rafael | Senha: $env:RDP_PASS | IP: $env:TS_IP"
          @(
            "## ✅ PC remoto no ar",
            "- Conta do Windows: **Rafael**",
            "- Senha: ``$env:RDP_PASS``",
            "- IP Tailscale (use no Remote Desktop): ``$env:TS_IP``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Manter o PC ligado
        shell: pwsh
        run: |
          $fim = (Get-Date).AddMinutes([int]'${{ inputs.minutos }}')
          while ((Get-Date) -lt $fim) { Start-Sleep -Seconds 60 }
          Write-Host 'Tempo esgotado. Encerrando.'
          
